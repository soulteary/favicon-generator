name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test preview interactions
        run: node --test web/app.test.mjs
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.27.4', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Check the Go version gate
        run: ./scripts/test-go-version.sh
      - name: Test, vet and build every module
        run: ./scripts/test.sh
      - name: Smoke test cold and warm pipeline benchmarks
        if: matrix.go-version == 'stable'
        env:
          BENCHTIME: 1x
          BENCHCOUNT: '1'
        run: ./scripts/benchmark.sh
      - name: Install pinned vulnerability scanner
        if: matrix.go-version == 'stable'
        run: GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Check vulnerabilities reachable from the main program
        if: matrix.go-version == 'stable'
        env:
          GOFLAGS: -mod=readonly
          GOWORK: 'off'
        run: '"$RUNNER_TEMP/bin/govulncheck" -db https://vuln.go.dev -show traces .'
