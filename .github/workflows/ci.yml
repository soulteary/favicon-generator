name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', stable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - name: Test, vet and build every module
        run: ./scripts/test.sh
      - name: Install pinned vulnerability scanner
        if: matrix.go-version == 'stable'
        run: GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check vulnerabilities reachable from the main program
        if: matrix.go-version == 'stable'
        env:
          GOFLAGS: -mod=readonly
          GOWORK: 'off'
        run: '"$RUNNER_TEMP/bin/govulncheck" -db https://vuln.go.dev -show traces .'
